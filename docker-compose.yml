version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/vitalis
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-change-in-production
      - DEBUG=true
    depends_on:
      - db
      - redis
    volumes:
      - ./uploads:/app/uploads
    networks:
      - vitalis-network

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vitalis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - vitalis-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - vitalis-network

  # Opcional: Servidor TURN para WebRTC
  coturn:
    image: coturn/coturn:latest
    command: --lt-cred-mech --min-port=49152 --max-port=65535 --verbose
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49152-65535:49152-65535/udp"
    networks:
      - vitalis-network

networks:
  vitalis-network:
    driver: bridge

volumes:
  postgres_data:
