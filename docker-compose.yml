version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+aiomysql://root:vitalis123@db:3306/vitalis
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-change-in-production
      - DEBUG=true
    depends_on:
      - db
      - redis
    volumes:
      - ./uploads:/app/uploads
    networks:
      - vitalis-network

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=vitalis123
      - MYSQL_DATABASE=vitalis
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - vitalis-network
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - vitalis-network

networks:
  vitalis-network:
    driver: bridge

volumes:
  mysql_data:
